<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Quiz Card Asset</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    max-width: 800px;
    width: 100%;
    text-align: center;
    border: 1px solid #334155;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 8px;
    color: #f1f5f9;
  }
  p.subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 0;
    margin-bottom: 20px;
  }
  .img-wrapper {
    background: #0f172a;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #334155;
    margin-bottom: 24px;
  }
  img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }
  .btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    cursor: pointer;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
  }
  .btn-primary {
    background: #10b981;
    color: #ffffff;
  }
  .btn-primary:hover {
    background: #059669;
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
  }
  .btn-secondary {
    background: #3b82f6;
    color: #ffffff;
  }
  .btn-secondary:hover {
    background: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
  }
  .meta {
    margin-top: 20px;
    font-size: 13px;
    color: #94a3b8;
    background: #0f172a;
    padding: 10px 16px;
    border-radius: 8px;
    display: inline-block;
  }
</style>
</head>
